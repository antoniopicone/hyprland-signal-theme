# macish · tema Segnale — per configurazioni Hyprland in hyprlang (hyprland.conf).
# Con Hyprland 0.55+ in Lua usa invece macish.lua (l'installer sceglie da solo).

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 1
    col.active_border = rgba(ff4a1cff)      # Segnale cambia colore con scuro/chiaro
    col.inactive_border = rgba(80808033)
}

decoration {
    rounding = 12
    rounding_power = 3

    shadow {
        enabled = true
        range = 28
        render_power = 3
        offset = 0 8
        color = rgba(00000055)
    }

    blur {
        enabled = false      # Segnale: superfici piene, niente vetro
    }
}

exec-once = qs -c macish

# Launcher, pannello rapido, tema scuro/chiaro
unbind = SUPER, SPACE
bind = SUPER, SPACE, exec, qs -c macish ipc call launcher toggle
bind = SUPER CTRL, C, exec, qs -c macish ipc call cc toggle
bind = SUPER CTRL, A, exec, qs -c macish ipc call agenti toggle
bind = SUPER CTRL, M, exec, qs -c macish ipc call notifiche toggle
bind = SUPER CTRL, N, exec, sh -c 'case "$(gsettings get org.gnome.desktop.interface color-scheme)" in *dark*) s=prefer-light;; *) s=prefer-dark;; esac; gsettings set org.gnome.desktop.interface color-scheme $s'

# Tasti multimediali: l'OSD di Segnale
unbind = , XF86AudioRaiseVolume
unbind = , XF86AudioLowerVolume
unbind = , XF86AudioMute
unbind = , XF86AudioMicMute
unbind = , XF86MonBrightnessUp
unbind = , XF86MonBrightnessDown
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -q set 5%+ && qs -c macish ipc call osd brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q set 5%- && qs -c macish ipc call osd brightness
